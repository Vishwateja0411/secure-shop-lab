name: Security CI & Regression Testing

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-tests:
    name: Security Tests & Static Analysis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secureshop
          POSTGRES_PASSWORD: test_ci_password_placeholder
          POSTGRES_DB: secureshop_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit safety flake8

      - name: 1. Secret Scanning (Static Secret Check)
        run: |
          echo "Scanning codebase for hardcoded credentials and high-entropy secrets..."
          # Scan for common secret patterns while ignoring test fixtures and documentation
          ! grep -rn "AKIA[0-9A-Z]\{16\}" backend/ || exit 1

      - name: 2. Static Application Security Testing (SAST with Bandit)
        run: |
          echo "Running Bandit SAST on backend code..."
          # Run Bandit reporting on high/medium severity findings in non-test app files
          bandit -r backend/app -ll -ii -x backend/tests || true

      - name: 3. Dependency Vulnerability Scan (Safety)
        run: |
          echo "Scanning python dependencies for known CVEs..."
          safety check -r backend/requirements.txt --ignore 70612 || true

      - name: 4. Automated Security Regression Tests (Pytest)
        env:
          DATABASE_URL: postgresql://secureshop:test_ci_password_placeholder@localhost:5432/secureshop_db
          SECURE_MODE: "true"
          SECRET_KEY: "ci_pipeline_temporary_secret_key_placeholder"
        run: |
          echo "Executing security test suite in SECURE_MODE=true..."
          pytest tests/security -v --maxfail=1
